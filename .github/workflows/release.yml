name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build shaderpack zip
        run: |
          zip -r "lightweight-shaders-${GITHUB_REF_NAME}.zip" shaders
          unzip -l "lightweight-shaders-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lightweight-shaders-${{ github.ref_name }}.zip
          generate_release_notes: true
